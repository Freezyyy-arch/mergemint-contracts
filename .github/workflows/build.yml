name: WASM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none

      - name: Report WASM binary size
        run: |
          WASM_FILE=$(find target/wasm32v1-none/release -name "*.wasm" | head -1)
          if [ -n "$WASM_FILE" ]; then
            SIZE=$(wc -c < "$WASM_FILE")
            echo "### WASM Binary Size" >> $GITHUB_STEP_SUMMARY
            echo "**File:** \`$WASM_FILE\`" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** ${SIZE} bytes ($(echo "scale=2; $SIZE/1024" | bc) KB)" >> $GITHUB_STEP_SUMMARY
          fi
